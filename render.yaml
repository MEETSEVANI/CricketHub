services:
  - type: web
    name: crickethub-capstone-api
    runtime: node
    plan: free
    rootDir: server
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health/database
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://crickethub-capstone-web.onrender.com

  - type: web
    name: crickethub-capstone-web
    runtime: static
    rootDir: client
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://crickethub-capstone-api.onrender.com
